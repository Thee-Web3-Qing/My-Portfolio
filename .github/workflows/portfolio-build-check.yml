name: Portfolio Build Check
on:
  push:
    branches:
      - feature/december-sale-2026
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  vite-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Compile Vite and pre-render public pages
        run: npm run build
